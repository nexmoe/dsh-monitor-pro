name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm check
      - run: pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-pro-node-${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error
