name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-windows:
    name: Windows backend (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            goarch: amd64
          # Public repositories can use GitHub's Windows ARM64 hosted runner.
          # Keep this a real runtime check rather than testing ARM64 via emulation.
          - runner: windows-11-arm
            arch: arm64
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache-dependency-path: native/go.sum
      - name: Verify native runner architecture
        shell: pwsh
        run: |
          if ((go env GOHOSTARCH) -ne '${{ matrix.goarch }}') {
            throw 'The backend must run on its native Windows architecture.'
          }
      - name: Run upstream Go tests on Windows
        working-directory: native
        run: go test -count=1 -timeout=3m ./...
      - name: Build Windows binaries
        run: node scripts/build-native.mjs
      - name: Exercise the packaged Windows executable
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'native/bin/win32-${{ matrix.arch }}/monitor.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'monitor-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'monitor-stderr.log'
          $backend = Start-Process -FilePath $binary -ArgumentList '-port', '0' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $port = $null
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              $backend.Refresh()
              if ($backend.HasExited) { throw "Backend exited with code $($backend.ExitCode)." }
              $ready = Get-Content $stdout -ErrorAction SilentlyContinue | Select-String '^SERVER_READY:(\d+)$' | Select-Object -First 1
              if ($ready) { $port = [int]$ready.Matches[0].Groups[1].Value; break }
              Start-Sleep -Milliseconds 200
            }
            if (-not $port) { throw 'Backend startup timed out.' }
            foreach ($path in @('/health', '/api/v1/basic', '/api/v1/cpu', '/api/v1/memory', '/api/v1/disk', '/api/v1/network', '/api/v1/host', '/api/v1/battery', '/api/v1/all')) {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port$path" -TimeoutSec 30
              $json = $response.Content | ConvertFrom-Json
              if ($response.StatusCode -ne 200 -or $response.Headers['Content-Type'] -notmatch 'application/json' -or $json.success -ne $true -or $null -eq $json.data) {
                throw "Invalid backend response from $path."
              }
              if ($path -eq '/api/v1/basic' -and $json.data.memTotal -le 0) { throw 'Backend returned no physical memory.' }
              if ($path -eq '/api/v1/host' -and $json.data.info.os -ne 'windows') { throw 'Backend did not report Windows host metrics.' }
              Write-Host "PASS $path (Windows ${{ matrix.arch }})"
            }
          } finally {
            if (-not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
          }

  check:
    runs-on: ubuntu-latest
    needs: native-windows
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache-dependency-path: native/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Run upstream Go tests with the race detector
        working-directory: native
        run: go test -race -count=1 -timeout=3m ./...
      - name: Build bundled Windows backends
        run: node scripts/build-native.mjs
      - run: pnpm check
      - run: pnpm pack --pack-destination artifacts
      - name: Verify native package contents
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readdirSync } from 'node:fs';
          const archive = readdirSync('artifacts').find(name => name.endsWith('.tgz'));
          if (!archive) throw new Error('Package archive is missing');
          const files = new Set(execFileSync('tar', ['-tzf', `artifacts/${archive}`], { encoding: 'utf8' }).trim().split('\n'));
          const licenses = readdirSync('native/LICENSES').map(name => `native/LICENSES/${name}`);
          for (const path of ['native/bin/win32-x64/monitor.exe', 'native/bin/win32-arm64/monitor.exe', 'native/README.md', 'native/THIRD_PARTY_NOTICES.txt', ...licenses]) {
            if (!files.has(`package/${path}`)) throw new Error(`Package omits ${path}; update the package.json files allowlist`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-pro-node-${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error
