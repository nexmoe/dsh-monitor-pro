name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Check tag matches package version
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw new Error("Tag must match package version");'
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm check
      - run: pnpm pack --pack-destination artifacts
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.tgz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS \
            --verify-tag --title "dsh-monitor-pro $GITHUB_REF_NAME" --generate-notes
