- insert:
    - id: nexmoe-monitor-pro
      name: '@nexmoe/dsh-monitor-pro'
      config:
        intervalMs: 2000
        historySize: 60
        source: auto
        mactopEnabled: true
        metrics: [cpu, memActive, memUsed, netRx, netTx, diskRx, diskWx, battery, batteryPower, cpuTemp, cpuSpeed, gpu, gpuTemp, gpuMem, diskSpace, osDistro, uptime]
